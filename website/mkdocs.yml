site_name: multilang
site_description: >-
  Usage examples for the multilang string/translation storage library —
  identical behavior in Python, PHP, Go, JavaScript, and C/C++.
site_url: https://rmahique.github.io/multilang-lib/
repo_url: https://github.com/rmahique/multilang-lib
repo_name: rmahique/multilang-lib
edit_uri: edit/main/website/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Python: python.md
  - JavaScript: javascript.md
  - PHP: php.md
  - Go: go.md
  - C / C++: c.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

# This site is *usage examples only* -- it deliberately doesn't mirror
# docs/ (design rationale) or each port's full README (install/test
# workflow, distro packaging). See ../../README.md and ../../docs/ for
# those. Every code block on this site is copied verbatim from a real,
# CI-tested example file (<language>/examples/basic_usage.*) -- if you
# change one of those files, update the matching page here in the same
# change (see AGENTS.md: docs are part of the change, not a follow-up).
