# Triggered by pushing a version tag (1.2.3, 1.0rc1, 1.0beta -- this
# repo's own tags have no "v" prefix, unlike the common v1.2.3 GitHub
# convention). Builds the same 30
# language x distro packages ci.yml builds on every push (via the shared
# build-packages.yml reusable workflow, so the matrix can't drift between
# the two), then attaches every .deb/.rpm/.sha512 to a GitHub Release for
# that tag -- giving README.md a stable download link
# (.../releases/latest/download/<file>) instead of a workflow-run
# artifact, which has no "latest" URL and expires (see
# build-packages.yml and README.md's Downloads section).
#
# Filenames are prefixed with their combo name (e.g.
# python-fedora-latest-<pkg>.rpm) before upload: rpmbuild's %{?dist} tag
# is empty on openSUSE/SLES (it's a Fedora-only macro by default), so
# without this prefix the Leap 15, Tumbleweed, and SLES 16 RPMs for the
# same language would have identical filenames and silently overwrite
# each other when flattened into one release's asset list.

name: Release

on:
  push:
    tags:
      # Matches this repo's actual tags (1.0, 1.0rc1, 1.0beta, and future
      # ones like 2.3.1) -- not "v*", since none of them use a v prefix.
      - "[0-9]+.[0-9]+*"
  # Lets an existing tag get a Release retroactively (e.g. a tag pushed
  # before this trigger pattern existed) without re-pushing it -- pick
  # the tag as the ref to run this workflow from (Actions tab -> Release
  # -> Run workflow -> Use workflow from: that tag).
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-packages.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: multilang-*
          path: dist-packages
      - name: Prefix each file with its combo name to guarantee unique filenames
        run: |
          mkdir -p release-assets
          for dir in dist-packages/multilang-*/; do
            combo="$(basename "$dir")"
            combo="${combo#multilang-}"
            for f in "$dir"*; do
              cp "$f" "release-assets/${combo}-$(basename "$f")"
            done
          done
          ls -la release-assets/
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
