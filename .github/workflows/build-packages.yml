# Reusable workflow: builds every language port's native package for
# every distro documented in <language>/packaging/README.md (Debian
# bookworm, Fedora latest, openSUSE Leap 15, openSUSE Tumbleweed, SLES
# 16, Alpine -- 30 combinations), and uploads each as a build artifact named
# multilang-<combo.name>. Version comes from scripts/compute-version.sh:
# the exact tag when HEAD is a release, otherwise <latest tag or that
# language's own manifest version> plus today's date. Each package gets
# a matching .sha512 file (see each <language>/packaging/build-deb.sh /
# build-rpm.sh) uploaded alongside it.
#
# Called from two places, kept in one file so the 20-entry matrix can't
# drift between them (see AGENTS.md: CI configs are part of the change,
# not a follow-up):
#   - ci.yml     — every push and PR, so a downloadable package always
#                  exists for the current commit, not just tagged
#                  releases.
#   - release.yml — on a version tag, so the same packages get attached
#                  to the GitHub Release.
#
# 5 languages x 6 distros = 30 explicit combinations rather than two
# independent matrix axes: dependencies differ enough per language+distro
# pair (Python's openSUSE Leap 15 job needs the leap15_python_workaround
# env var that no other job needs; C needs -devel packages none of the
# other four languages need at all; Alpine's build/collect commands are
# structurally different from every .deb/.rpm job, see build-apk.sh) that
# composing them from two axes would be harder to read than just listing
# them.
#
# Each combo builds on the *same distro it packages for* -- a Debian
# package is built inside a Debian container, an RPM for openSUSE Leap 15
# is built inside an openSUSE Leap 15 container, etc. -- via a Dockerfile
# per combo at <language>/packaging/docker/Dockerfile.<distro> that bakes
# in every build dependency (this used to install dependencies at
# runtime into a bare upstream image via the job's own `container:`
# field; moved into a Dockerfile, matching the existing
# `Dockerfile.conformance` pattern in conformance/run-unit-tests.sh, both
# to fix a bootstrapping problem and to keep the "same distro builds its
# own package" property explicit and in one place per combo). The
# bootstrapping problem: with dependencies installed at runtime via a
# job-level `container:` image, `actions/checkout` itself runs *inside*
# that bare container before anything is installed -- and on a container
# with no git, checkout falls back to a REST-API-download-plus-tar path
# that then fails too if tar is *also* missing (true for the bare
# openSUSE images). Building the Dockerfile as an explicit step instead
# means checkout runs on the host runner (which always has git and tar),
# and the container is only ever used, fully assembled, to run the build.

name: Build packages

on:
  workflow_call:

jobs:
  package:
    name: package (${{ matrix.combo.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        combo:
          # --- Python ---
          - name: python-debian-bookworm
            language: python
            distro: debian-bookworm
            build: packaging/build-deb.sh
            collect: cp ../*.deb ../*.deb.sha512 dist-packages/
          - name: python-fedora-latest
            language: python
            distro: fedora-latest
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: python-opensuse-leap-15
            language: python
            distro: opensuse-leap-15
            build: MULTILANG_LEAP15_PYTHON_WORKAROUND=1 packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: python-opensuse-tumbleweed
            language: python
            distro: opensuse-tumbleweed
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: python-sles-16
            language: python
            distro: sles-16
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: python-alpine
            language: python
            distro: alpine
            build: packaging/build-apk.sh
            collect: find /home/builder/packages -name "*.apk" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/

          # --- Go (source-only) ---
          - name: go-debian-bookworm
            language: go
            distro: debian-bookworm
            build: packaging/build-deb.sh
            collect: cp ../*.deb ../*.deb.sha512 dist-packages/
          - name: go-fedora-latest
            language: go
            distro: fedora-latest
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: go-opensuse-leap-15
            language: go
            distro: opensuse-leap-15
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: go-opensuse-tumbleweed
            language: go
            distro: opensuse-tumbleweed
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: go-sles-16
            language: go
            distro: sles-16
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: go-alpine
            language: go
            distro: alpine
            build: packaging/build-apk.sh
            collect: find /home/builder/packages -name "*.apk" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/

          # --- JavaScript (source-only, wraps the npm package) ---
          - name: javascript-debian-bookworm
            language: javascript
            distro: debian-bookworm
            build: packaging/build-deb.sh
            collect: cp ../*.deb ../*.deb.sha512 dist-packages/
          - name: javascript-fedora-latest
            language: javascript
            distro: fedora-latest
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: javascript-opensuse-leap-15
            language: javascript
            distro: opensuse-leap-15
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: javascript-opensuse-tumbleweed
            language: javascript
            distro: opensuse-tumbleweed
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: javascript-sles-16
            language: javascript
            distro: sles-16
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: javascript-alpine
            language: javascript
            distro: alpine
            build: packaging/build-apk.sh
            collect: find /home/builder/packages -name "*.apk" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/

          # --- PHP (source-only, wraps the Composer package) ---
          - name: php-debian-bookworm
            language: php
            distro: debian-bookworm
            build: packaging/build-deb.sh
            collect: cp ../*.deb ../*.deb.sha512 dist-packages/
          - name: php-fedora-latest
            language: php
            distro: fedora-latest
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: php-opensuse-leap-15
            language: php
            distro: opensuse-leap-15
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: php-opensuse-tumbleweed
            language: php
            distro: opensuse-tumbleweed
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: php-sles-16
            language: php
            distro: sles-16
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: php-alpine
            language: php
            distro: alpine
            build: packaging/build-apk.sh
            collect: find /home/builder/packages -name "*.apk" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/

          # --- C/C++ (real compiled shared-library + headers split) ---
          - name: c-debian-bookworm
            language: c
            distro: debian-bookworm
            build: packaging/build-deb.sh
            collect: cp ../*.deb ../*.deb.sha512 dist-packages/
          - name: c-fedora-latest
            language: c
            distro: fedora-latest
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: c-opensuse-leap-15
            language: c
            distro: opensuse-leap-15
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: c-opensuse-tumbleweed
            language: c
            distro: opensuse-tumbleweed
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: c-sles-16
            language: c
            distro: sles-16
            build: packaging/build-rpm.sh
            collect: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name "*.rpm" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
          - name: c-alpine
            language: c
            distro: alpine
            build: packaging/build-apk.sh
            collect: find /home/builder/packages -name "*.apk" -o -name "*.sha512" | xargs -I{} cp {} dist-packages/
    steps:
      - uses: actions/checkout@v7
      - name: Build the ${{ matrix.combo.distro }} packaging image
        run: >
          docker build
          -t pkgimg
          -f ${{ matrix.combo.language }}/packaging/docker/Dockerfile.${{ matrix.combo.distro }}
          ${{ matrix.combo.language }}/packaging/docker
      - name: Build package + checksum, then collect into a fixed path
        # Runs as a single `docker run` (build + collect together, not two
        # separate steps): rpmbuild writes to $HOME/rpmbuild *inside* the
        # container, which is gone the moment `--rm` exits, so collecting
        # has to happen before that container exits, not in a later step.
        # $PWD (the checked-out repo) is bind-mounted in and is what
        # persists on the host afterward for actions/upload-artifact.
        #
        # The inner `bash -c '...'` is deliberately single-quoted, not
        # double-quoted: matrix.combo.collect's `find "$HOME/rpmbuild/..."`
        # needs $HOME to resolve *inside the container* (root's $HOME,
        # where rpmbuild actually writes) -- with double quotes here, the
        # outer runner shell expands $HOME itself (to /home/runner, which
        # doesn't have an rpmbuild dir at all) before docker even starts,
        # so the collect step silently finds nothing and every RPM combo
        # fails with "No files were found" despite the package having
        # built successfully.
        run: |
          docker run --rm -v "$PWD:/workspace" -w "/workspace/${{ matrix.combo.language }}" pkgimg bash -c '
            set -e
            ${{ matrix.combo.build }}
            mkdir -p dist-packages
            ${{ matrix.combo.collect }}
          '
      - uses: actions/upload-artifact@v7
        with:
          name: multilang-${{ matrix.combo.name }}
          path: ${{ matrix.combo.language }}/dist-packages/
          if-no-files-found: error
