# --- conformance stage: real Postgres/MySQL, one Docker-in-Docker job per language ---

.conformance_job: &conformance_job
  stage: conformance
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  <<: *conformance_rules

conformance-python:
  <<: *conformance_job
  script:
    - ./conformance/run-live-db-tests.sh python

conformance-javascript:
  <<: *conformance_job
  script:
    - ./conformance/run-live-db-tests.sh javascript

conformance-php:
  <<: *conformance_job
  script:
    - ./conformance/run-live-db-tests.sh php

conformance-go:
  <<: *conformance_job
  script:
    - ./conformance/run-live-db-tests.sh go

conformance-c:
  <<: *conformance_job
  script:
    - ./conformance/run-live-db-tests.sh c
