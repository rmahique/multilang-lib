    - cd python
  script:
    - packaging/build-rpm.sh
    - mkdir -p dist-packages
    - find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" \( -name "*.rpm" -o -name "*.sha512" \) -exec cp {} dist-packages/ \;
  artifacts:
    paths:
      - python/dist-packages/
    expire_in: 30 days

package-python-alpine:
  stage: package
  image: alpine:3.20
  before_script:
    # abuild refuses to run its build/package steps as root -- see
    # python/packaging/README.md's "Alpine" section, same non-root
    # builder + ephemeral signing key setup as packaging/docker/Dockerfile.alpine.
    - apk add --no-cache alpine-sdk sudo python3 python3-dev py3-setuptools py3-build py3-installer py3-wheel py3-pytest tar git
    - adduser -D builder
    - addgroup builder abuild
    - echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
    - su builder -c 'abuild-keygen -a -i -n'
    - cd python
  script:
    - packaging/build-apk.sh
    - mkdir -p dist-packages
    - find /home/builder/packages \( -name "*.apk" -o -name "*.sha512" \) -exec cp {} dist-packages/ \;
  artifacts:
    paths:
